name: HKRelay

options:
  bundleIdPrefix: org.homekitrestbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BridgeCore:
    path: ..

targets:
  HKRelay:
    type: application
    platform: iOS
    productName: HKRelay
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
      - path: ../integrations/openclaw/hkrelay-api
        type: folder
        buildPhase: resources
      - path: ../integrations/openclaw/hkrelay-cli
        type: folder
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHomeKitUsageDescription: HKRelay reads and controls only the Home accessories you explicitly permit in the app.
        NSLocalNetworkUsageDescription: HKRelay accepts API connections from devices on your local network when you enable local network access.
        NSHumanReadableCopyright: Copyright © 2026 HKRelay contributors. Licensed under MIT.
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Resources/HKRelay.entitlements
      properties:
        com.apple.developer.homekit: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - package: BridgeCore
        product: BridgeCore
      - package: BridgeCore
        product: BridgeServer
      - sdk: HomeKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - target: HKRelayMenu
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_NAME: HKRelay
        PRODUCT_BUNDLE_IDENTIFIER: $(HKBRIDGE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SUPPORTS_MACCATALYST: true
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(HKBRIDGE_DEVELOPMENT_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  HKRelayMenu:
    type: application
    productName: HomeKit Bridge Menu
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: ../MenuBarHelper/Sources
      - path: ../MenuBarHelper/Resources/Assets.xcassets
    info:
      path: ../MenuBarHelper/Resources/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    entitlements:
      path: ../MenuBarHelper/Resources/HKRelayMenu.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: HKRelay Menu
        # Keep the internal path cached by existing ServiceManagement registrations.
        WRAPPER_NAME: HomeKit Bridge Menu.app
        PRODUCT_BUNDLE_IDENTIFIER: $(HKBRIDGE_BUNDLE_IDENTIFIER).menu
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(HKBRIDGE_DEVELOPMENT_TEAM)
        SKIP_INSTALL: true
        REGISTER_APP_IN_LAUNCH_SERVICES: NO

schemes:
  HKRelay:
    build:
      targets:
        HKRelay: all
    run:
      config: Debug
    archive:
      config: Release
